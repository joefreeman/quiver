[package]
name = "quiver-tests"
version.workspace = true
edition.workspace = true

[dependencies]
quiver-core = { path = "../quiver-core" }
quiver-compiler = { path = "../quiver-compiler" }
quiver-environment = { path = "../quiver-environment" }
quiver = { path = "../quiver-cli", package = "quiver-cli" }
quiver-io = { path = "../quiver-io" }

[dev-dependencies]
serde_json.workspace = true
# The test TLS server (tests/common/tls_server.rs). Ring-only, matching quiver-io's rustls:
# a second crypto provider in the tree would make `ClientConfig::builder()` ambiguous and
# panic at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
