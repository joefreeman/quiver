[package]
name = "quiver-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "quiv"
path = "src/main.rs"

[dependencies]
quiver-core = { path = "../quiver-core" }
quiver-compiler = { path = "../quiver-compiler" }
quiver-environment = { path = "../quiver-environment" }
quiver-io = { path = "../quiver-io" }
quiver-markdown = { path = "../quiver-markdown" }
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"
signal-hook = "0.3"
colored = "2.1"
ariadne = "0.4"
serde_json.workspace = true
serde.workspace = true
libc = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
# CORS for the opt-in TCP listener only; the socket path never sees it.
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = "0.1"
getrandom = "0.3"
