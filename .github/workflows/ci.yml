name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the toolchain version, components and targets from rust-toolchain.toml,
      # and caches the build (replacing a separate Swatinem/rust-cache step).
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests
        run: cargo test --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Build the formatter from this checkout and assert every .qv source in the tree is
      # already canonically formatted. `format --check` writes nothing and exits 1 (listing
      # each offending file) if any would change, or 2 if it could not read or parse one.
      - name: Check Quiver formatting
        run: |
          cargo run --quiet --bin quiv -- format --check . || {
            echo "::error::Quiver sources are not formatted. Run 'quiv format' and commit the result."
            exit 1
          }

      # Every runnable example in the README, the guide and the module references is executed
      # and its `//=` assertions checked. The references are the modules' test suites as well
      # as their documentation, so a failure here is a failing test, not a stale doc. The
      # README's block is annotated `quiver program`, which runs its entry point — without
      # that its assertions would sit in a function nothing calls, and be reported deferred
      # rather than checked.
      - name: Check the README, the guide and module references
        run: cargo run --quiet --bin quiv -- test README.md docs/guide.md std/docs/*.md

      # The executable companion to the README's block. Named rather than globbed: an example
      # that serves or connects would never return, so a new one belongs here only if it runs
      # to completion on its own.
      - name: Run the examples
        run: cargo run --quiet --bin quiv -- run examples/sum.qv

      - name: Run clippy
        run: cargo clippy --all --all-targets -- -D warnings

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # build.sh bundles the tree-sitter grammar via `npx tree-sitter`, which needs the
      # tree-sitter-cli devDependency installed in tree-sitter/.
      - name: Install tree-sitter dependencies
        run: cd tree-sitter && npm install

      - name: Build WASM
        run: cd quiver-web && ./build.sh

      - name: Verify package.json was generated
        run: test -f quiver-web/pkg/package.json

      - name: Show generated package.json
        run: cat quiver-web/pkg/package.json

  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The grammar carries the *language's* version: a grammar release means exactly "the
      # grammar that parses Quiver X.Y.Z". It is excluded from the Cargo workspace (it has
      # a Node toolchain of its own) so it cannot inherit the number, which leaves four
      # files holding it and nothing keeping them together. Assert it here, on every push,
      # rather than discovering the drift when something is published.
      - name: Verify the grammar's version matches the workspace
        run: |
          workspace=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          status=0
          expect() {
            if [ "$2" != "$workspace" ]; then
              echo "::error file=$1::$1 declares $2, but the workspace is $workspace"
              status=1
            fi
          }
          expect tree-sitter/Cargo.toml \
            "$(grep -m1 '^version = ' tree-sitter/Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          expect tree-sitter/package.json \
            "$(node -p "require('./tree-sitter/package.json').version")"
          expect tree-sitter/tree-sitter.json \
            "$(node -p "require('./tree-sitter/tree-sitter.json').metadata.version")"
          expect tree-sitter/package-lock.json \
            "$(node -p "require('./tree-sitter/package-lock.json').version")"
          expect tree-sitter/package-lock.json \
            "$(node -p "require('./tree-sitter/package-lock.json').packages[''].version")"
          if [ "$status" != 0 ]; then
            echo "::error::Set every version at once with 'scripts/set-version.sh <version>'."
            exit 1
          fi
          echo "Grammar and workspace agree on $workspace"

      - name: Install dependencies
        run: cd tree-sitter && npm install

      - name: Verify the committed parser matches grammar.js
        run: |
          cd tree-sitter
          npx tree-sitter generate
          git diff --exit-code src/ || {
            echo "::error::src/ is out of date. Run 'tree-sitter generate' in tree-sitter/ and commit the result."
            exit 1
          }

      - name: Run corpus tests
        run: cd tree-sitter && npx tree-sitter test

      - name: Parse all Quiver source files (grammar/parser sync guard)
        run: tree-sitter/scripts/check-corpus.sh
